long_description = """Fetch lyrics from LRCLIB's crowdsourced database. **Sidecar-only fork:** lyrics go to .lrc (synced) or .txt (plain) next to the audio and never into its tags; automatic fetching never touches an existing sidecar **Jellyfin/Plex Ready:** Generated .lrc files work seamlessly with media servers and Kodi **Configurable Workflow:** Toggle auto-fetching in plugin settings **Smart Fetch:** Prefers synchronized lyrics when available, falls back to plain text _Based on Dylancyclone's plugin_"""
